<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .section {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #2a2a2a;
        }
        #loading {
            display: none;
            color: #666;
            text-align: center;
            padding: 10px;
        }
        button {
            background-color: #0060df;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #003eaa;
        }
        #error {
            color: #d70022;
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <button id="analyzeBtn">Analyze Email</button>
    <div id="loading">Analyzing email content...</div>
    <div id="error"></div>
    
    <div class="section">
        <div class="section-title">Summary:</div>
        <div id="summary"></div>
    </div>
    
    <div class="section">
        <div class="section-title">Suggested Response:</div>
        <div id="suggestion"></div>
    </div>
    
    <div class="section">
        <div class="section-title">Action Items:</div>
        <div id="actions"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
